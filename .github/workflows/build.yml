name: Build APK

on:
  push:
    branches: [builds]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAX_REPAIR_ROUNDS: 8

    steps:

      # ────────────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ────────────────────────────────────────────────────────────────────────
      - name: Préparation
        uses: actions/checkout@v4
        with:
          ref: builds

      # ────────────────────────────────────────────────────────────────────────
      # 2. Extraction brute du ZIP
      # ────────────────────────────────────────────────────────────────────────
      - name: Extraction sûre
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/.github/scripts/safe_extract.py" \
            builds/incoming.zip project > extraction-report.json
          cat extraction-report.json
          echo "Extraction validée."

      # ────────────────────────────────────────────────────────────────────────
      # 3. Analyse du projet (AVANT toute validation stricte)
      # ────────────────────────────────────────────────────────────────────────
      - name: Analyse du projet
        id: analyze_project
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/.github/scripts/project_analyzer.py" project \
            > project-analysis.json 2>&1 || true

          # Lire score
          SCORE_PCT=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('project-analysis.json'))
            print(d.get('score',{}).get('pct', 0))
          except: print(0)
          ")
          HAS_SOURCES=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('project-analysis.json'))
            kts = len(d.get('kotlinFiles',[]))
            jvs = len(d.get('javaFiles',[]))
            print(1 if kts+jvs > 0 else 0)
          except: print(0)
          ")

          echo "score_pct=$SCORE_PCT" >> "$GITHUB_OUTPUT"
          echo "has_sources=$HAS_SOURCES" >> "$GITHUB_OUTPUT"

          {
            echo "### 🔍 Analyse du projet"
            echo ""
            python3 -c "
          import json
          try:
            d = json.load(open('project-analysis.json'))
            s = d.get('score', {})
            checks = s.get('checks', {})
            print(f'**Score de préparation : {s.get(\"pct\",0)}% ({s.get(\"total\",0)}/{s.get(\"max\",0)})**')
            print('')
            labels = {
              'sources': 'Code source',
              'manifest': 'AndroidManifest.xml',
              'root_gradle': 'build.gradle racine',
              'app_gradle': 'build.gradle module',
              'settings': 'settings.gradle',
              'gradle_properties': 'gradle.properties',
              'wrapper': 'Gradle Wrapper',
              'no_misplaced': 'Aucun fichier mal placé',
            }
            print('| Élément | Statut |')
            print('|---|---|')
            for k, v in checks.items():
              print(f'| {labels.get(k,k)} | {\"✅\" if v else \"⚠️\"} |')
            print('')
            kts = len(d.get('kotlinFiles',[]))
            jvs = len(d.get('javaFiles',[]))
            print(f'- Fichiers Kotlin : {kts}')
            print(f'- Fichiers Java : {jvs}')
            msp = len(d.get('misplacedFiles',[]))
            if msp:
              print(f'- ⚠️ Fichiers mal placés : {msp}')
            miss = len(d.get('missingFiles',[]))
            if miss:
              print(f'- ⚠️ Fichiers manquants : {miss}')
          except Exception as e:
            print(f'Analyse indisponible : {e}')
            "
          } >> "$GITHUB_STEP_SUMMARY"

          # L’absence de sources ne bloque plus immédiatement : le réparateur peut
          # générer un APK de secours déterministe, avec un rapport explicite.
          if [ "$HAS_SOURCES" -eq 0 ]; then
            echo "::warning::Aucun code source détecté — préparation d’un APK de secours si nécessaire."
          fi

      # ────────────────────────────────────────────────────────────────────────
      # 4. Reconstruction automatique du projet
      # ────────────────────────────────────────────────────────────────────────
      - name: Reconstruction du projet
        run: |
          set -e
          echo "Lancement de la reconstruction automatique…"
          python3 "$GITHUB_WORKSPACE/.github/scripts/project_repair.py" project
          echo "Reconstruction terminée."

          # Afficher le rapport de réparation
          if [ -f repair-report.json ]; then
            {
              echo ""
              echo "### 🔧 Rapport de reconstruction"
              echo ""
              python3 -c "
          import json
          try:
            r = json.load(open('repair-report.json'))
            moved   = r.get('moved', [])
            created = r.get('created', [])
            modified= r.get('modified', [])
            warns   = r.get('warnings', [])
            score   = r.get('post_repair_score', {})
            if score:
              print(f'**Score post-réparation : {score.get(\"pct\",\"?\")}%**')
              print('')
            if moved:
              print(f'**Déplacés ({len(moved)}) :**')
              for e in moved[:20]:
                print(f'- \`{e.get(\"from_\",\"?\")}\` → \`{e.get(\"to\",\"?\")}\`')
            if created:
              print(f'**Créés ({len(created)}) :**')
              for e in created[:20]:
                print(f'- \`{e.get(\"file\",\"?\")}\` — {e.get(\"reason\",\"\")}')
            if modified:
              print(f'**Modifiés ({len(modified)}) :**')
              for e in modified[:10]:
                print(f'- \`{e.get(\"file\",\"?\")}\` — {e.get(\"reason\",\"\")}')
            if warns:
              print(f'**Avertissements ({len(warns)}) :**')
              for e in warns[:10]:
                print(f'- {e.get(\"msg\",str(e))}')
          except Exception as ex:
            print(f'Rapport indisponible : {ex}')
              "
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Réparation Android complémentaire
          python3 "$GITHUB_WORKSPACE/.github/scripts/android_repair.py" project || true

      # ────────────────────────────────────────────────────────────────────────
      # 5. Lecture de la config de build
      # ────────────────────────────────────────────────────────────────────────
      - name: Lecture config
        id: analyze
        run: |
          CONFIG=builds/build-config.json
          [ -f "$CONFIG" ] || echo '{}' > "$CONFIG"
          echo "build_type=$(jq -r '.buildType // "debug"' $CONFIG)"   >> "$GITHUB_OUTPUT"
          echo "apk_name=$(jq -r '.apkName // "app"' $CONFIG)"         >> "$GITHUB_OUTPUT"
          echo "version_name=$(jq -r '.versionName // empty' $CONFIG)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(jq -r '.versionCode // empty' $CONFIG)" >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────────────────────────────────
      # 6. Java
      # ────────────────────────────────────────────────────────────────────────
      - name: Installation Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ────────────────────────────────────────────────────────────────────────
      # 7. Gradle Wrapper — détection intelligente de version
      # ────────────────────────────────────────────────────────────────────────
      - name: Installation Gradle Wrapper
        working-directory: project
        run: |
          set -e

          # Détecter la version AGP dans les fichiers Gradle
          AGP_VERSION=$(grep -rh "com.android.tools.build:gradle:" . 2>/dev/null \
            | grep -oP ":\d+\.\d+[\.\d]*" | head -1 | tr -d ':' || true)
          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION=$(grep -rh "com.android.application.*version" . 2>/dev/null \
              | grep -oP '"\d+\.\d+[\.\d]*"' | head -1 | tr -d '"' || true)
          fi
          [ -z "$AGP_VERSION" ] && AGP_VERSION="8.4.0"
          echo "AGP détecté : $AGP_VERSION"

          # Choisir la version Gradle compatible à partir de la matrice locale.
          GRADLE_TARGET=$(python3 "$GITHUB_WORKSPACE/.github/scripts/repair_utils.py" --gradle-for "$AGP_VERSION" 2>/dev/null || true)
          GRADLE_MIN=$(python3 "$GITHUB_WORKSPACE/.github/scripts/repair_utils.py" --minimum-gradle-for "$AGP_VERSION" 2>/dev/null || true)
          [ -z "$GRADLE_TARGET" ] && GRADLE_TARGET="8.7"
          [ -z "$GRADLE_MIN" ] && GRADLE_MIN="8.6"

          # Conserver uniquement un wrapper déjà compatible ; sinon le régénérer.
          WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"
          WRAPPER_COMPATIBLE=0
          if [ -f "$WRAPPER_PROPS" ]; then
            CURRENT_GRADLE=$(grep -oP "gradle-\K\d+\.\d+[\.\d]*" "$WRAPPER_PROPS" | head -1 || true)
            echo "Gradle wrapper actuel : ${CURRENT_GRADLE:-inconnu}"
            if [ -n "$CURRENT_GRADLE" ] && [ "$(printf '%s\n%s\n' "$GRADLE_MIN" "$CURRENT_GRADLE" | sort -V | head -1)" = "$GRADLE_MIN" ]; then
              GRADLE_TARGET="$CURRENT_GRADLE"
              WRAPPER_COMPATIBLE=1
              echo "Wrapper existant compatible : Gradle $GRADLE_TARGET"
            else
              echo "Wrapper absent ou incompatible — Gradle $GRADLE_TARGET sera généré."
            fi
          fi

          # Générer le wrapper si absent ou jar manquant
          NEED_WRAPPER=0
          [ ! -f "gradlew" ]                            && NEED_WRAPPER=1
          [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]  && NEED_WRAPPER=1
          [ ! -f "$WRAPPER_PROPS" ]                     && NEED_WRAPPER=1
          [ "$WRAPPER_COMPATIBLE" -ne 1 ]                && NEED_WRAPPER=1

          if [ "$NEED_WRAPPER" -eq 1 ]; then
            echo "Génération du wrapper Gradle $GRADLE_TARGET…"
            DIST_URL="https://services.gradle.org/distributions/gradle-${GRADLE_TARGET}-bin.zip"
            curl -sL "$DIST_URL" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_TARGET}/bin/gradle wrapper \
              --gradle-version "$GRADLE_TARGET" \
              --distribution-type bin
            echo "Wrapper généré."
          fi

          chmod +x gradlew

          # Vérification rapide
          ./gradlew --version --no-daemon 2>&1 | head -5 || true

      # ────────────────────────────────────────────────────────────────────────
      # 8. Compilation avec boucle autofix
      # ────────────────────────────────────────────────────────────────────────
      - name: Compilation
        working-directory: project
        run: |
          set -o pipefail

          TASK="assembleDebug"
          EXTRA_ARGS=""
          [ "${{ steps.analyze.outputs.build_type }}" = "release" ] && TASK="assembleRelease"
          [ -n "${{ steps.analyze.outputs.version_name }}" ] && \
            EXTRA_ARGS="$EXTRA_ARGS -PversionNameOverride=${{ steps.analyze.outputs.version_name }}"
          [ -n "${{ steps.analyze.outputs.version_code }}" ] && \
            EXTRA_ARGS="$EXTRA_ARGS -PversionCodeOverride=${{ steps.analyze.outputs.version_code }}"

          LOG="../gradle-output.log"
          AUTOFIX_LOG="../autofix-summary.log"
          : > "$AUTOFIX_LOG"

          run_gradle() {
            set +e
            ./gradlew $TASK $EXTRA_ARGS --no-daemon --stacktrace 2>&1 | tee "$LOG"
            local code=${PIPESTATUS[0]}
            set -e
            return $code
          }

          last_error_hash=""
          round=0
          run_gradle; exit_code=$?

          while [ $exit_code -ne 0 ] && [ $round -lt "$MAX_REPAIR_ROUNDS" ]; do
            round=$((round + 1))
            echo ""
            echo "═══ Tour de réparation $round / $MAX_REPAIR_ROUNDS ═══"

            # Détecter si l'erreur change (évite les boucles infinies)
            error_hash=$(grep -E "^e: |: error:|FAILURE:|What went wrong" "$LOG" 2>/dev/null | md5sum | cut -d' ' -f1)
            if [ "$error_hash" = "$last_error_hash" ] && [ $round -gt 1 ]; then
              echo "::warning::Même erreur depuis 2 tours — arrêt de la boucle autofix."
              break
            fi
            last_error_hash="$error_hash"

            # Erreur réseau → simple retry
            if grep -qiE 'Connection reset|Read timed out|Could not GET|Remote host closed|Received fatal alert' "$LOG"; then
              echo "::warning::Erreur réseau transitoire — nouvel essai direct…"
              sleep 10
              run_gradle; exit_code=$?
              continue
            fi

            # Appliquer les corrections heuristiques
            if python3 "$GITHUB_WORKSPACE/.github/scripts/heuristic_fix.py" "$LOG" . >> "$AUTOFIX_LOG" 2>&1; then
              echo "::warning::Correction automatique appliquée au tour $round."
              run_gradle; exit_code=$?
            else
              # Aucune correction reconnue → inutile de recompiler
              echo "::warning::Aucune correction automatique reconnue pour les erreurs restantes."
              break
            fi
          done

          # Résumé autofix
          if [ -s "$AUTOFIX_LOG" ]; then
            {
              echo ""
              echo "### 🔁 Corrections automatiques de compilation"
              echo ""
              echo '```'
              cat "$AUTOFIX_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ $exit_code -ne 0 ]; then
            {
              echo ""
              echo "### ❌ Échec de la compilation (code $exit_code)"
              echo ""
              echo "#### Erreurs détectées"
              echo '```'
              grep -E '^e: |: error:|FAILURE:|What went wrong|Execution failed for' "$LOG" | head -60
              echo '```'
              echo ""
              echo "#### Fin du log"
              echo '```'
              tail -40 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::La compilation Gradle a échoué après $round tour(s) de correction. Voir le résumé."
            exit $exit_code
          fi

          echo ""
          echo "✅ Compilation réussie après $round tour(s) de correction."

      # ────────────────────────────────────────────────────────────────────────
      # 9. Signature release (optionnelle)
      # ────────────────────────────────────────────────────────────────────────
      - name: Signature
        if: steps.analyze.outputs.build_type == 'release'
        working-directory: project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Aucun secret de signature configuré — APK release non signée."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APK=$(find . -path "*/build/outputs/apk/*.apk" | head -n1)
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$APK"

      # ────────────────────────────────────────────────────────────────────────
      # 10. Récupération de l'APK
      # ────────────────────────────────────────────────────────────────────────
      - name: Création APK
        id: apk
        working-directory: project
        run: |
          # Chercher l'APK dans n'importe quel module
          APK_PATH=$(find . -path "*/build/outputs/apk/*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Compilation réussie mais aucune APK trouvée."
            exit 1
          fi
          NAME="${{ steps.analyze.outputs.apk_name }}.apk"
          cp "$APK_PATH" "$NAME"
          echo "apk_path=project/$NAME" >> "$GITHUB_OUTPUT"
          echo "APK trouvée : $APK_PATH → $NAME"

      - name: Publication APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.analyze.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Publication log complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output-log
          path: gradle-output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publication rapport de réparation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-report
          path: repair-report.json
          retention-days: 14
          if-no-files-found: ignore
          
